name: Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build docs (fails on broken links, every version)
        run: npx docusaurus build
